{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-white fw-bold"><i class="bi bi-inbox-fill me-2"></i>SOLICITUDES DE RMA</h2>
        <div class="d-flex gap-2">
            <form method="get" action="{{ url_for('lab.solicitudes_csv_mensual') }}" class="d-flex gap-2 align-items-center">
                <input type="month" name="month" class="form-control form-control-sm bg-dark text-white border-secondary" value="{{ current_month }}">
                <button type="submit" class="btn btn-outline-warning btn-sm">
                    <i class="bi bi-calendar2-week me-1"></i>CSV Mensual
                </button>
            </form>
            <a href="{{ url_for('lab.dashboard') }}" class="btn btn-outline-light">Volver</a>
        </div>
    </div>

    <div class="card bg-dark border-secondary">
        <div class="card-body p-0">
            <table class="table table-dark table-hover mb-0 align-middle" id="solicitudes-table">
                <thead>
                    <tr class="text-secondary small text-uppercase">
                        <th class="ps-4">Origen</th>
                        <th>Equipo</th>
                        <th>Falla Reportada</th>
                        <th class="text-end pe-4">Acción</th>
                    </tr>
                </thead>
                <tbody id="solicitudes-list" hx-get="{{ url_for('lab.solicitudes_partial') }}" hx-trigger="every 5s"
                    hx-swap="innerHTML">
                    {% for m in solicitudes %}
                    <tr id="solicitud-{{ m.id }}">
                        <td class="ps-4 text-warning">{{ m.ubicacion_corta }}</td>
                        <td>
                            <div class="fw-bold">{{ m.sn_fisica }}</div>
                            <div class="small text-white">{{ m.modelo }}</div>
                        </td>
                        <td class="text-danger">{{ m.diagnostico_detalle }}</td>
                        <td class="text-end pe-4">
                            <form method="post" action="{{ url_for('lab.iniciar_reparacion') }}" class="d-inline" onsubmit="return confirm('¿Recibir este equipo e iniciar diagnóstico en la Mesa de Trabajo?');">
                                <input type="hidden" name="id" value="{{ m.id }}">
                                <button class="btn btn-primary btn-sm" type="submit">
                                    <i class="bi bi-tools"></i> RECIBIR Y REPARAR
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center py-4 text-white">Sin solicitudes pendientes.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Agregar estilos para el spinner HTMX -->
<style>
    .htmx-indicator {
        display: none;
    }

    .htmx-request .htmx-indicator {
        display: inline-block;
    }

    .htmx-request.htmx-indicator {
        display: inline-block;
    }

    /* Animación de salida suave cuando se elimina el elemento */
    tr.htmx-swapping {
        opacity: 0;
        transition: opacity 500ms ease-out;
    }
</style>
{% endblock %}
